# All hooks run the tool versions pinned in requirements/dev.lock (installed in your
# venv), so pre-commit never fetches unpinned third-party hook code.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, incl. security rules)
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit (SAST)
        entry: bandit -q -c pyproject.toml -r src
        language: system
        types: [python]
        pass_filenames: false
