name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks out code and runs local tools.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Actions are pinned to full commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (hash-pinned lockfile, no unpinned build dependencies)
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Ruff (lint, incl. security rules)
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest

  security:
    name: Security scans (SAST + SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: SAST (bandit)
        run: bandit -c pyproject.toml -r src
      - name: SCA (pip-audit on every locked dependency)
        run: pip-audit --strict --require-hashes -r requirements/dev.lock
      - name: Workflow security (zizmor)
        run: zizmor --offline --persona auditor action.yml .github/workflows/

  secrets:
    name: Secret scanning (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        # Official image pinned by digest (v8.30.1), no network. Runs as the runner user
        # so git's ownership check passes; --redact keeps any finding out of the log.
        run: >
          docker run --rm --network none --user "$(id -u):$(id -g)"
          -v "${GITHUB_WORKSPACE}:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install --require-hashes -r requirements/dev.lock
      - name: Build wheel and a clean runtime environment
        # The SBOM describes exactly what a user installs: the runtime lockfile plus
        # this package, in an environment with no installer tooling.
        run: |
          python -m pip wheel --no-deps --no-build-isolation -w dist .
          python -m venv --without-pip runtime-env
          python -m pip --python runtime-env/bin/python install --require-hashes -r requirements/runtime.lock
          python -m pip --python runtime-env/bin/python install --no-deps --no-index dist/*.whl
      - name: Generate SBOM
        run: >
          cyclonedx-py environment --pyproject pyproject.toml --mc-type application
          --output-format JSON --output-reproducible -o sbom.cdx.json runtime-env/bin/python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
