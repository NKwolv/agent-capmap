name: Release

# Publishes a version to PyPI and GitHub Releases when a tag like v0.1.0 is pushed.
# PyPI uses trusted publishing (OIDC): no API token is stored in this repository.
on:
  push:
    tags: ["v*"]

# Every job declares the minimum it needs.
permissions: {}

# One release at a time, and never cancel one halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (tests and SCA)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version $version in pyproject.toml"
            exit 1
          fi
      - name: Install (hash-pinned lockfile)
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Tests
        run: pytest
      - name: SCA (pip-audit on every locked dependency)
        run: |
          pip-audit --strict --require-hashes -r requirements/runtime.lock
          pip-audit --strict --require-hashes -r requirements/build.lock

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel (hash-pinned build backend)
        run: |
          python -m pip install --require-hashes -r requirements/build.lock
          python -m hatchling build -t sdist -t wheel
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Configure this environment on GitHub with a required reviewer so every release
    # needs a manual approval; PyPI's trusted publisher is bound to it.
    environment:
      name: pypi
      url: https://pypi.org/project/agent-capmap/
    permissions:
      id-token: write # OIDC token for trusted publishing and attestations
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the distributions
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "$TAG"
          --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md). Install: \`pipx install agent-capmap==${TAG#v}\`"
