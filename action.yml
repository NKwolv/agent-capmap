name: agent-capmap
description: >-
  Map the MCP tool capabilities reachable by each AI agent and flag dangerous
  combinations with policy-as-code. Writes SARIF for GitHub code scanning.
author: NKwolv
branding:
  icon: shield
  color: orange

inputs:
  path:
    description: Directory or config file to scan, relative to the workspace.
    default: "."
  policy:
    description: Policy YAML file (default the built-in policy).
    default: ""
  baseline:
    description: Baseline JSON for rug-pull detection (CAP-006).
    default: ""
  fail-on:
    description: "Fail when a finding is at or above: critical, high, medium, low, info, or none."
    default: high
  fail-on-not-assessed:
    description: Fail when any server or tool could not be assessed (true/false).
    default: "false"
  enumerate:
    description: >-
      Start the configured MCP servers and list their tools (true/false). This RUNS the
      commands found in the scanned configs. Never enable it for untrusted pull requests,
      and never in a job that holds secrets you would not hand to those commands.
    default: "false"
  classify:
    description: >-
      Classify tools with the LLM (true/false). Needs enumerate: true and, unless offline,
      ANTHROPIC_API_KEY in the step's env.
    default: "false"
  offline:
    description: With classify, use cached classifications only (true/false).
    default: "false"
  cache-dir:
    description: Classification cache directory (restore it with actions/cache).
    default: ""
  comment:
    description: >-
      On pull_request events, compare with the base branch and post what changed (new
      findings, newly unassessed servers, gained capabilities) as one comment that is
      updated on later pushes (true/false). Config-only: it cannot be combined with
      enumerate. Needs `pull-requests: write` and a checkout with `fetch-depth: 0`.
      Forks get a read-only token, so there the diff goes to the job summary only.
    default: "false"
  github-token:
    description: Token used to post the comment (only needs pull-requests write).
    default: ${{ github.token }}
  sarif-file:
    description: Where to write the SARIF report, relative to the workspace.
    default: agentcapmap.sarif
  python-version:
    description: Python version used to run agent-capmap.
    default: "3.12"

outputs:
  sarif-file:
    description: Path of the SARIF report.
    value: ${{ steps.scan.outputs.sarif-file }}
  findings:
    description: Total number of findings.
    value: ${{ steps.scan.outputs.findings }}
  not-assessed:
    description: Number of servers or tools that could not be assessed.
    value: ${{ steps.scan.outputs.not-assessed }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install agent-capmap (hash-pinned)
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        venv="${RUNNER_TEMP}/agentcapmap-venv"
        python -m venv "$venv"
        if [[ -x "$venv/bin/python" ]]; then py="$venv/bin/python"; else py="$venv/Scripts/python.exe"; fi
        "$py" -m pip install --quiet --disable-pip-version-check --require-hashes \
          -r "$ACTION_PATH/requirements/build.lock" -r "$ACTION_PATH/requirements/runtime.lock"
        "$py" -m pip install --quiet --disable-pip-version-check --no-deps --no-build-isolation "$ACTION_PATH"
        echo "python=$py" >> "$GITHUB_OUTPUT"

    - name: Scan and evaluate
      id: scan
      shell: bash
      env:
        PY: ${{ steps.install.outputs.python }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FAIL_ON_NOT_ASSESSED: ${{ inputs.fail-on-not-assessed }}
        INPUT_ENUMERATE: ${{ inputs.enumerate }}
        INPUT_CLASSIFY: ${{ inputs.classify }}
        INPUT_OFFLINE: ${{ inputs.offline }}
        INPUT_CACHE_DIR: ${{ inputs.cache-dir }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        set -uo pipefail
        fail() { echo "::error title=agent-capmap::$1"; exit 2; }
        is_bool() { [[ "$1" == "true" || "$1" == "false" ]]; }
        for name in INPUT_FAIL_ON_NOT_ASSESSED INPUT_ENUMERATE INPUT_CLASSIFY INPUT_OFFLINE; do
          is_bool "${!name}" || fail "$name must be true or false"
        done
        case "$INPUT_FAIL_ON" in critical|high|medium|low|info|none) ;; *) fail "fail-on is invalid";; esac
        case "$INPUT_SARIF_FILE" in /*|*..*|"") fail "sarif-file must be a relative path inside the workspace";; esac

        evaluation="${RUNNER_TEMP}/agentcapmap-evaluation.json"
        args=(scan "$INPUT_PATH" --evaluate -o "$evaluation")
        [[ -n "$INPUT_POLICY" ]] && args+=(--policy "$INPUT_POLICY")
        [[ -n "$INPUT_BASELINE" ]] && args+=(--baseline "$INPUT_BASELINE")
        if [[ "$INPUT_ENUMERATE" == "true" ]]; then
          echo "::warning title=agent-capmap::enumerate is on: the commands in the scanned configs will run"
          args+=(--enumerate)
        fi
        if [[ "$INPUT_CLASSIFY" == "true" ]]; then
          [[ "$INPUT_ENUMERATE" == "true" ]] || fail "classify needs enumerate: true"
          args+=(--classify)
          [[ "$INPUT_OFFLINE" == "true" ]] && args+=(--offline)
          [[ -n "$INPUT_CACHE_DIR" ]] && args+=(--cache-dir "$INPUT_CACHE_DIR")
        fi

        "$PY" -m agentcapmap "${args[@]}" || fail "scan failed"
        "$PY" -m agentcapmap report "$evaluation" --format sarif -o "$INPUT_SARIF_FILE" || fail "could not write SARIF"
        "$PY" -m agentcapmap report "$evaluation" --format markdown >> "$GITHUB_STEP_SUMMARY" || true

        "$PY" - "$evaluation" >> "$GITHUB_OUTPUT" <<'EOF'
        import json, sys
        data = json.load(open(sys.argv[1], encoding="utf-8"))
        print(f"findings={len(data['findings'])}")
        print(f"not-assessed={len(data['not_assessed'])}")
        EOF
        echo "sarif-file=$INPUT_SARIF_FILE" >> "$GITHUB_OUTPUT"

        gate=(report "$evaluation" --fail-on "$INPUT_FAIL_ON" -o "${RUNNER_TEMP}/agentcapmap-gate.json")
        [[ "$INPUT_FAIL_ON_NOT_ASSESSED" == "true" ]] && gate+=(--fail-on-not-assessed)
        "$PY" -m agentcapmap "${gate[@]}"

    - name: Compare with the base branch and comment
      if: ${{ always() && inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        PY: ${{ steps.install.outputs.python }}
        GH_TOKEN: ${{ inputs.github-token }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        WORKSPACE: ${{ github.workspace }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_ENUMERATE: ${{ inputs.enumerate }}
      run: |
        set -uo pipefail
        fail() { echo "::error title=agent-capmap::$1"; exit 2; }
        soft() { echo "::warning title=agent-capmap::$1"; exit 0; }
        [[ "$INPUT_ENUMERATE" == "false" ]] || fail "comment is for config-only pull request checks: enumerate runs the commands in the configs"
        [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "unexpected base commit"
        [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || fail "unexpected pull request number"
        [[ "$REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || fail "unexpected repository name"

        head_eval="${RUNNER_TEMP}/agentcapmap-evaluation.json"
        base_dir="${RUNNER_TEMP}/agentcapmap-base"
        empty_dir="${RUNNER_TEMP}/agentcapmap-empty"
        base_eval="${RUNNER_TEMP}/agentcapmap-base-evaluation.json"
        diff_json="${RUNNER_TEMP}/agentcapmap-diff.json"
        diff_md="${RUNNER_TEMP}/agentcapmap-diff.md"
        body="${RUNNER_TEMP}/agentcapmap-comment.md"
        abs() { if [[ "$1" == /* ]]; then printf '%s' "$1"; else printf '%s/%s' "$WORKSPACE" "$1"; fi; }

        [[ -f "$head_eval" ]] || soft "no evaluation to compare (the scan step did not finish)"
        git -C "$WORKSPACE" cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null           || soft "base commit not available: use actions/checkout with fetch-depth: 0 to enable the comparison"
        git -C "$WORKSPACE" worktree add --detach "$base_dir" "$BASE_SHA" >/dev/null 2>&1           || soft "could not check out the base commit"
        trap 'git -C "$WORKSPACE" worktree remove --force "$base_dir" >/dev/null 2>&1 || true' EXIT

        # The head's policy and baseline are used for both sides, so only the pull
        # request's own changes show up. A path that does not exist on the base yet
        # (the PR adds the first MCP config there) is compared against nothing.
        scan_target="$INPUT_PATH"
        if [[ ! -e "$base_dir/$INPUT_PATH" ]]; then mkdir -p "$empty_dir"; scan_target="$empty_dir"; fi
        args=(scan "$scan_target" --evaluate -o "$base_eval")
        [[ -n "$INPUT_POLICY" ]] && args+=(--policy "$(abs "$INPUT_POLICY")")
        [[ -n "$INPUT_BASELINE" ]] && args+=(--baseline "$(abs "$INPUT_BASELINE")")
        (cd "$base_dir" && "$PY" -m agentcapmap "${args[@]}") || soft "could not scan the base commit"

        "$PY" -m agentcapmap diff "$base_eval" "$head_eval" --format json -o "$diff_json" || fail "diff failed"
        "$PY" -m agentcapmap diff "$base_eval" "$head_eval" --format markdown -o "$diff_md" || fail "diff failed"
        cat "$diff_md" >> "$GITHUB_STEP_SUMMARY"

        # Build the comment body (marker first, trimmed to GitHub's size limit) and say
        # whether anything changed.
        changed=$("$PY" - "$diff_json" "$diff_md" "$body" <<'EOF'
        import json, sys
        data = json.load(open(sys.argv[1], encoding="utf-8"))
        text = open(sys.argv[2], encoding="utf-8").read()
        if len(text) > 60000:
            text = text[:60000] + "\n\n_Truncated; see the job summary._\n"
        marker = "<!-- agent-capmap-diff -->"
        open(sys.argv[3], "w", encoding="utf-8").write(marker + "\n" + text)
        keys = ("new_findings", "resolved_findings", "gained_capabilities",
                "lost_capabilities", "new_not_assessed")
        print(1 if any(data[k] for k in keys) else 0)
        EOF
        )

        command -v gh >/dev/null 2>&1 || soft "gh is not installed on this runner; the diff is in the job summary"
        # Only update a comment this action's own bot wrote, never one that merely
        # contains the marker.
        existing=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" --paginate           --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- agent-capmap-diff -->"))) | .id'           2>/dev/null | head -n1 || true)
        if [[ "$changed" != "1" && -z "$existing" ]]; then
          echo "No changes compared with the base; not commenting."
          exit 0
        fi
        if [[ -n "$existing" && "$existing" =~ ^[0-9]+$ ]]; then
          gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" -F body=@"$body" >/dev/null             || soft "could not update the comment (forks get a read-only token); the diff is in the job summary"
        else
          gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@"$body" >/dev/null             || soft "could not post the comment (forks get a read-only token); the diff is in the job summary"
        fi
